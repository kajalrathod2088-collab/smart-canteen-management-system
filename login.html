{% extends "base.html" %}

{% block title %}Log In | Smart Canteen{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-12">

    <div class="bg-white rounded-3xl border border-slate-200 shadow-xl p-6 sm:p-8">
        <div class="text-center mb-6">
            <div class="w-14 h-14 rounded-2xl bg-orange-100 text-orange-600 flex items-center justify-center mx-auto text-2xl mb-3 shadow-inner">
                <i class="fa-solid fa-id-badge"></i>
            </div>
            <h1 class="text-2xl font-black text-slate-900">Student & Staff Portal</h1>
            <p class="text-xs text-slate-500 mt-1">Enter your College Roll Number to access your Smart Canteen</p>
        </div>

        <!-- 1-Click Demo Fillers (Great for College Viva / Demo!) -->
        <div class="mb-6 p-3 bg-amber-50/70 border border-amber-200 rounded-2xl">
            <div class="text-[11px] font-bold text-amber-800 uppercase tracking-wider mb-2 flex items-center gap-1">
                <i class="fa-solid fa-wand-magic-sparkles text-amber-600"></i> One-Click Demo Credentials:
            </div>
            <div class="grid grid-cols-2 gap-2">
                <button type="button" onclick="fillStudent()" class="text-left bg-white p-2 rounded-xl border border-amber-300 hover:border-amber-500 transition-all text-xs">
                    <span class="font-bold text-slate-800 block">🧑‍🎓 Student</span>
                    <span class="text-[10px] text-slate-500 font-mono">Roll: CS202601</span>
                </button>
                <button type="button" onclick="fillAdmin()" class="text-left bg-white p-2 rounded-xl border border-amber-300 hover:border-amber-500 transition-all text-xs">
                    <span class="font-bold text-slate-800 block">👨‍🍳 Kitchen Chef</span>
                    <span class="text-[10px] text-slate-500 font-mono">User: admin</span>
                </button>
            </div>
        </div>

        <form action="{{ url_for('login') }}" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Student Roll No / Username</label>
                <div class="relative">
                    <span class="absolute left-3.5 top-3 text-slate-400 text-sm">
                        <i class="fa-regular fa-user"></i>
                    </span>
                    <input type="text" id="rollNoInput" name="roll_no" required placeholder="e.g. CS202601 or admin" class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500 font-medium">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Password</label>
                <div class="relative">
                    <span class="absolute left-3.5 top-3 text-slate-400 text-sm">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" id="passwordInput" name="password" required placeholder="••••••••" class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500 font-medium">
                </div>
            </div>

            <button type="submit" class="w-full bg-orange-600 hover:bg-orange-700 text-white font-extrabold text-sm py-3 rounded-xl shadow-lg shadow-orange-600/30 transition-all hover:-translate-y-0.5 active:scale-95">
                Log In to Canteen
            </button>
        </form>

        <div class="mt-6 pt-4 border-t border-slate-100 text-center text-xs text-slate-500">
            Don't have an account yet? 
            <a href="{{ url_for('register') }}" class="font-bold text-orange-600 hover:underline">Register New Student ID</a>
        </div>
    </div>

</div>

<script>
    function fillStudent() {
        document.getElementById('rollNoInput').value = 'CS202601';
        document.getElementById('passwordInput').value = 'student123';
    }
    function fillAdmin() {
        document.getElementById('rollNoInput').value = 'admin';
        document.getElementById('passwordInput').value = 'admin123';
    }
</script>
{% endblock %}
